name: Daily Chemistry Bot

on:
  schedule:
    - cron: '0 8 * * *'  # UTC时间8:00
  workflow_dispatch: {}   # 支持手动触发（写为{}更安全）

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests

      - name: 运行智能体
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        run: python daily_chemistry.py
